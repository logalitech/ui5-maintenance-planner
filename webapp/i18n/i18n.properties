# This is the resource bundle for sapui5.maintenanceplanner

#Texts for manifest.json

#XTIT: Application name
appTitle=Maintenance Request Planning

#YDES: Application description
appDescription=Planner inbox for plant maintenance requests

#Texts for annotations

#XTIT: Singular name of the request entity
requestTypeName=Request

#XTIT: Plural name of the request entity, used as the table title
requestTypeNamePlural=Requests

#XTIT: Title of the status indicator in the request header
statusDataPointTitle=Status

#XTIT: Title of the priority indicator in the request header
priorityDataPointTitle=Priority

#XTIT: Section title for the general data of the request
facetGeneral=General Data

#XTIT: Section title for the execution data of the request
facetExecution=Execution

#XTIT: Section title for the tasks table
facetTasks=Tasks

#XTIT: Section title for the spare parts table
facetParts=Spare Parts

#XTIT: Section title for the attachments table
facetAttachments=Attachments

#XTIT: Singular name of the task entity
taskTypeName=Task

#XTIT: Plural name of the task entity, used as the table title
taskTypeNamePlural=Tasks

#XBUT: Button to assign a request to a technician
actionAssign=Assign

#XBUT: Button to start the work on a request
actionStartWork=Start

#XBUT: Button to complete a request
actionComplete=Complete

#XBUT: Button to reject a request
actionReject=Reject

#XFLD: Column header of the plant in the indicators table
indicatorsPlant=Plant

#XFLD: Column header of the status in the indicators table
indicatorsStatus=Status

#XFLD: Column header of the priority in the indicators table
indicatorsPriority=Priority

#XFLD: Column header of the number of requests in the indicators table
indicatorsRequestCount=Requests

#Texts for extensions

#XBUT: Button of the requests table that opens the indicators page
indicatorsAction=Indicators

#XTIT: Title of the indicators page
indicatorsPageTitle=Indicators

#XTIT: Title of the custom section with the preview of the image attachments
imagePreviewSectionTitle=Preview

#XMSG: Text shown in the preview section when the request has no image attachments
imagePreviewNoImages=This request has no images.
